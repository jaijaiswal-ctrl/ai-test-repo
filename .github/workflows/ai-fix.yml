
name: ai-fix

# Agent tab chalta hai jab kisi issue pe 'ai-fix' label lagta hai
on:
  issues:
    types: [labeled]

jobs:
  fix:
    # Sirf 'ai-fix' label, aur sirf repo ke owner ke lagane par
    if: github.event.label.name == 'ai-fix' && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Ek hi issue pe do run ek saath nahi
    concurrency:
      group: ai-fix-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Agent ka code lao (private repo)
        uses: actions/checkout@v4
        with:
          repository: jaijaiswal-ctrl/project-nexus
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          path: agent

      - name: Python lagao
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Libraries install karo
        run: pip install -r agent/requirements-agent.txt

      - name: Agent chalao
        working-directory: agent
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT_MODEL: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
        # Exit code 0  = PR bani aur reviewer ne approve kiya.
        # Exit code 10 = PR bani par reviewer ne approve nahi kiya.
        # Exit code 11 = PR nahi bani, insaan dekhe.
        # In teeno me run hara rahega. Baaki sab (jaise 1 ya 2) asli error hain, tab run laal hoga.
        run: |
          python github_agent.py --repo "${{ github.repository }}" --issue ${{ github.event.issue.number }} --comment || code=$?
          echo "Agent exit code: ${code:-0}"
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 10 ] && [ "${code:-0}" -ne 11 ]; then
            exit "$code"
          fi
